[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "context-renderer"
dynamic = ["version"]
description = "Generate structured Markdown context sheets from MSSQL databases"
readme = "PACKAGE.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mssql", "database", "documentation", "context", "markdown", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Documentation",
]
dependencies = [
    "pyodbc>=5.0",
    "SQLAlchemy>=2.0",
    "pandas>=2.0",
    "jinja2>=3.1",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/aurelienlegros/context-renderer"
Repository = "https://github.com/aurelienlegros/context-renderer"
Issues = "https://github.com/aurelienlegros/context-renderer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]
notebooks = [
    "jupyter>=1.1",
    "notebook>=7.3",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["context_renderer"]

[tool.hatch.build.targets.sdist]
include = ["context_renderer/", "PACKAGE.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
