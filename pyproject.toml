[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "context-renderer"
version = "0.1.0"
description = "Generate structured Markdown context sheets from MSSQL databases"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mssql", "database", "documentation", "context", "markdown", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Documentation",
]
dependencies = [
    "pyodbc>=5.0",
    "SQLAlchemy>=2.0",
    "pandas>=2.0",
    "jinja2>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["context_renderer*"]

[tool.ruff]
line-length = 100
target-version = "py310"
